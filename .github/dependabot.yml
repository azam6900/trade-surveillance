version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /ui/trade-ui
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/services/*", "/ui/trade-ui"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }