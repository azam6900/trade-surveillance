server.port: 8082
spring:
  application.name: ingestion-service
  kafka.bootstrap-servers: localhost:9092
management.endpoints.web.exposure.include: health,info,prometheus
simulator.events-per-second: 20
server.shutdown: graceful                        # stop taking new requests, finish current ones
spring.lifecycle.timeout-per-shutdown-phase: 20s # but give up after 20 s
management.endpoint.health.probes.enabled: true   # /actuator/health/liveness and /readiness