server.port: 8081
spring:
  application:
    name: alert-case-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alert-case
      auto-offset-reset: earliest     # a brand-new group starts from the oldest message
    data:
      redis:
        host: localhost
        port: 6379
  mongodb:
    uri: mongodb://localhost:27017/tradesurv
    representation.uuid: standard
    data.mongodb.representation.big-decimal: decimal128
  datasource:
    url: jdbc:postgresql://localhost:5432/tradesurv
    username: app
    password: ${DB_PASSWORD:app}
  jpa.hibernate.ddl-auto: validate
  #security.oauth2.resourceserver.jwt.issuer-uri: http://localhost:8180/realms/trade
  #security.oauth2.resourceserver.jwt.jwk-set-uri: http://localhost:8180/realms/trade/protocol/openid-connect/certs
management.endpoints.web.exposure.include: health,info,prometheus
#logging.level.org.springframework.security: DEBUG
spring.data.web.pageable.max-page-size: 100