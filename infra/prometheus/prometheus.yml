global:
  scrape_interval: 5s

scrape_configs:
  - job_name: laptop               # services started with mvn spring-boot:run
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080', 'host.docker.internal:8081',
                  'host.docker.internal:8082', 'host.docker.internal:8083']

  - job_name: compose              # services started with --profile full
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080', 'alert-case-service:8081', 'ingestion-service:8082', 'detection-service:8083']