apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trade-secrets
  namespace: trade
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: gcp }
  target: { name: trade-secrets }        # the Kubernetes Secret to create
  data:
    - secretKey: postgres-password       # key inside trade-secrets
      remoteRef: { key: trade-postgres-password }        # name in Secret Manager
    - secretKey: keycloak-admin-password
      remoteRef: { key: trade-keycloak-admin-password }