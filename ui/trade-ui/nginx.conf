server {
  listen 8080;                        # unprivileged image: no root, so no port 80
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html; # unknown paths such as /cases/123 go to React's router
  }

  location /assets/ {
    expires 1y;                        # file names contain a content hash, so caching forever is safe
    add_header Cache-Control "public, immutable";
  }
}